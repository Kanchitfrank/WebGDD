name: Publish GDD website
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public website without local admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import hashlib
          import re
          from urllib.parse import urlsplit, urlunsplit
          output = Path('_public')
          output.mkdir()
          for item in Path('.').iterdir():
              if item.name.startswith('.') or item.name in ('admin', '_public'):
                  continue
              if item.is_dir():
                  shutil.copytree(item, output / item.name)
              elif item.suffix in ('.html', '.css', '.js', '.ico'):
                  shutil.copy2(item, output / item.name)
          for page in output.rglob('*.html'):
              def version_asset(match):
                  parts = urlsplit(match.group(3))
                  if parts.scheme or parts.netloc or not parts.path:
                      return match.group(0)
                  asset = (page.parent / parts.path).resolve()
                  if not asset.is_relative_to(output.resolve()) or asset.suffix not in ('.css', '.js') or not asset.is_file():
                      return match.group(0)
                  version = hashlib.sha256(asset.read_bytes()).hexdigest()[:12]
                  query = '&'.join(value for value in parts.query.split('&') if value and not value.startswith('v='))
                  url = urlunsplit(('', '', parts.path, (query + '&' if query else '') + 'v=' + version, parts.fragment))
                  return match.group(1) + match.group(2) + url + match.group(2)
              pattern = r"""(\b(?:src|href)=)(["'])([^"']+)\2"""
              page.write_text(re.sub(pattern, version_asset, page.read_text(encoding='utf-8')), encoding='utf-8')
          (output / '.nojekyll').touch()
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
